name: check

# Fast-fail lint/test on short-lived work branches, before it ever reaches
# main and triggers a dev-track release build.
#
# Builds in the same dev mode as dev-release.yml (git.breadway.dev
# dependencies patched to their own repo's main via bread-ecosystem's
# scripts/dev-deps.sh, no --locked), so a PR that depends on a
# just-merged, not-yet-tagged change in bread-ecosystem passes here
# instead of only being testable after a tag bump. See bread-ecosystem's
# docs/release-channels.md ("Cross-repo dependency resolution") for the
# full model. Part of ECO-38.
on:
  push:
    branches: ['feature/**', 'fix/**']

jobs:
  check:
    runs-on: [self-hosted]
    steps:
      - name: checkout
        shell: bash
        run: |
          set -euo pipefail
          # Pinned, SHA-verified helper from bread-ecosystem (reviewed on main,
          # see its dev-bread-theme.yml). The digest is checked before the
          # helper runs. It checks out the event SHA into a per-job directory.
          helper_commit=c6442cabb6c02acd1380dcd0d17189c4e22def03
          helper_sha256=39d07ff4efe2336fe5eac1f1099590d5427e04111e0f51fc3f905df2cfbd205f
          helper=$(mktemp "${RUNNER_TEMP:-/tmp}/ci-checkout.XXXXXX")
          trap 'rm -f -- "$helper"' EXIT
          curl -fsSL "https://git.breadway.dev/Breadway/bread-ecosystem/raw/commit/${helper_commit}/scripts/ci-checkout.sh" -o "$helper"
          printf '%s  %s\n' "$helper_sha256" "$helper" | sha256sum --check
          checkout=$(mktemp -d "${RUNNER_TEMP:-/tmp}/bread-ci.XXXXXX")
          printf 'BREAD_CI_JOB_DIR=%s\n' "$checkout" >> "$GITHUB_ENV"
          bash "$helper" "https://git.breadway.dev/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA" "$checkout/src"

      - name: clone bread-ecosystem (main)
        run: |
          set -euo pipefail
          ECOSYSTEM_CI_DIR="$(mktemp -d /tmp/bread-ecosystem-check-XXXXXX)"
          git clone --branch main https://git.breadway.dev/Breadway/bread-ecosystem.git "${ECOSYSTEM_CI_DIR}"
          echo "ECOSYSTEM_CI_DIR=${ECOSYSTEM_CI_DIR}" >> "$GITHUB_ENV"

      # Fails if any git.breadway.dev dependency in src's Cargo.toml uses
      # rev/branch/path instead of tag. Cargo.toml itself must always stay
      # tag-pinned; dev-mode resolution to main happens only at build time,
      # below, never by editing the manifest.
      - name: lint git.breadway.dev dependency pins
        run: bash "${ECOSYSTEM_CI_DIR}/scripts/lint-pins.sh" --root "$BREAD_CI_JOB_DIR/src"

      - name: resolve dev dependencies to main
        run: |
          set -euo pipefail
          cd "$BREAD_CI_JOB_DIR/src"
          bash "${ECOSYSTEM_CI_DIR}/scripts/dev-deps.sh" --root .
          rm -rf "${ECOSYSTEM_CI_DIR}"

      - name: fmt
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo fmt --all -- --check

      - name: clippy
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo clippy --all-targets -- -D warnings

      - name: test
        run: cd "$BREAD_CI_JOB_DIR/src" && bash ci/build.sh cargo test --release

      # Runs last so no earlier step loses its tree. Removes only this job's
      # own checkout directory, and only under RUNNER_TEMP.
      - name: clean owned checkout
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${BREAD_CI_JOB_DIR:-}" == "${RUNNER_TEMP:-/tmp}"/bread-ci.* && -d "$BREAD_CI_JOB_DIR" ]]; then
            if [[ "${BREAD_CI_JOB_DIR}" == *"/../"* ]]; then
              echo "clean owned checkout: refusing BREAD_CI_JOB_DIR with a .. segment" >&2
              exit 1
            fi
            rm -rf -- "$BREAD_CI_JOB_DIR"
          fi
